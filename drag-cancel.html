<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liem Shot — Drag Cancel</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        pointer-events: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 14px 24px 14px 20px;
        border-radius: 999px;
        background: rgba(214, 51, 72, 0.94);
        border: 1.5px solid rgba(255, 255, 255, 0.45);
        color: rgba(255, 255, 255, 1);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
        box-shadow:
          0 20px 60px rgba(140, 18, 32, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        backdrop-filter: blur(22px) saturate(1.4);
        -webkit-backdrop-filter: blur(22px) saturate(1.4);
        animation: pop-in 260ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #pill svg { display: block; }
      @keyframes pop-in {
        from { opacity: 0; transform: translateY(10px) scale(0.94); }
        to   { opacity: 1; transform: translateY(0)    scale(1);    }
      }
    </style>
  </head>
  <body>
    <div id="pill" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
        <path d="M8 8l8 8M16 8l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <span>Drop here to cancel</span>
    </div>
  </body>
</html>
