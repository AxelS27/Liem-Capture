<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liem Shot Thumbnail</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        padding: 0;
      }

      #shell {
        width: 100%;
        height: 100%;
        position: relative;
        padding: 0;
        overflow: hidden;
        border-radius: 8px;
        background: transparent;
        transform-origin: 50% 100%;
      }

      #shell:hover {
        background: transparent;
      }

      #shell.dismissing {
        opacity: 0;
        transform: translateY(34px) scale(0.975);
        transition:
          opacity 320ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #preview {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 8px;
        background: transparent;
        cursor: grab;
        touch-action: none;
      }

      #preview.dragging {
        cursor: grabbing;
      }

      #image {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: transparent;
        -webkit-user-drag: none;
      }

      #status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.28);
      }

      #status[hidden] {
        display: none;
      }

      #bar {
        position: absolute;
        left: 9px;
        right: 9px;
        bottom: 4px;
        height: 2px;
        pointer-events: none;
        opacity: 1;
        transition: opacity 140ms ease;
      }

      #track {
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
      }

      #progress {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: rgba(255, 255, 255, 0.92);
        transform-origin: left;
        transform: scaleX(1);
        transition: none;
      }

      .icon-button {
        position: absolute;
        top: 8px;
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.2);
        color: rgba(255, 255, 255, 0.62);
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
        opacity: 0;
        transition:
          opacity 140ms ease,
          color 140ms ease,
          background 140ms ease;
      }

      #shell:hover .icon-button {
        opacity: 1;
      }

      .icon-button:hover {
        color: rgba(255, 255, 255, 0.94);
        background: rgba(0, 0, 0, 0.28);
      }

      #pin {
        right: 34px;
      }

      #close {
        right: 8px;
      }

      #shell.pinned #bar {
        opacity: 0;
      }

      #shell.pinned .icon-button {
        opacity: 1;
        color: rgba(255, 255, 255, 0.94);
        background: rgba(0, 0, 0, 0.3);
      }

      #shell.pinned #close {
        display: none;
      }

      #shell.pinned #pin {
        right: 8px;
      }

      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <main id="shell">
      <section id="preview" aria-label="Screenshot preview">
        <img id="image" alt="Screenshot" draggable="false" hidden />
        <div id="status" hidden></div>
      </section>

      <footer id="bar">
        <div id="track"><div id="progress"></div></div>
      </footer>
      <button id="pin" class="icon-button" title="Keep floating" aria-label="Keep floating">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 17v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          <path d="M7 3h10" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          <path d="M8.5 3l1 8-3 4h11l-3-4 1-8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="close" class="icon-button" title="Dismiss" aria-label="Dismiss">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </main>

    <script type="module" src="/src/thumbnail.ts"></script>
  </body>
</html>
